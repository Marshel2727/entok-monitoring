services:
  mobile-apk:
    build:
      context: ./apk-mobile-entok
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./apk-mobile-entok:/app
      - ./apk-mobile-entok/build-output:/output
      - flutter-pub-cache:/root/.pub-cache
      - flutter-gradle-cache:/root/.gradle
    command: >
      sh -lc "if [ ! -d android ]; then flutter create . --platforms=android --project-name penjaga_entok --org com.entok; fi &&
      sh scripts/prepare_android_notifications.sh &&
      flutter pub get &&
      flutter build apk --debug &&
      mkdir -p /output &&
      cp build/app/outputs/flutter-apk/app-debug.apk /output/penjaga-entok-debug.apk"

volumes:
  flutter-pub-cache:
  flutter-gradle-cache:
