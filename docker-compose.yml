services:
  database:
    image: mysql:8.4
    container_name: entok_database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: entok_db
      MYSQL_USER: entok_user
      MYSQL_PASSWORD: entok_password
    ports:
      - "3307:3306"
    volumes:
      - entok_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: entok_backend
    restart: unless-stopped
    environment:
      DB_USER: entok_user
      DB_PASSWORD: entok_password
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: entok_db
      PORT: 5000
      SECRET_KEY: change-this-secret
      JWT_SECRET_KEY: change-this-jwt-secret
      IOT_DEVICE_API_KEY: change-this-device-key
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5000:5000"
    volumes:
      - entok_uploads:/app/app/static/uploads
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api
    container_name: entok_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
      BACKEND_API_URL: http://backend:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  apk-mobile:
    profiles:
      - apk
    build:
      context: ./apk-mobile-entok
    container_name: entok_apk_mobile_builder
    volumes:
      - ./apk-mobile-entok:/app
      - ./apk-mobile-entok/build-output:/output
      - flutter_pub_cache:/root/.pub-cache
      - flutter_gradle_cache:/root/.gradle

volumes:
  entok_mysql_data:
  entok_uploads:
  flutter_pub_cache:
  flutter_gradle_cache:
