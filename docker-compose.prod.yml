services:
  database:
    image: mysql:8.4
    container_name: entok_database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-entok_db}
      MYSQL_USER: ${DB_USER:-entok_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - entok_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: entok_backend
    restart: unless-stopped
    environment:
      DB_USER: ${DB_USER:-entok_user}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-entok_db}
      PORT: 5000
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
    ports:
      - "5001:5000"
    volumes:
      - entok_uploads:/app/app/static/uploads
    depends_on:
      database:
        condition: service_healthy

volumes:
  entok_mysql_data:
  entok_uploads:
